name: GitGuardian Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 2026-11-08 13:41 +03: read-only token by default; jobs that write declare it (CodeQL missing-workflow-permissions, repo sweep)
permissions:
  contents: read

jobs:
  scanning:
    name: GitGuardian Scan
    # 2026-11-06 23:22 +03: skip on Dependabot PRs: they get no repo secrets, so the scan always failed (Boss 22:4x 'ok skip', task #1017)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base_ref }}
          GITHUB_DEFAULT_BRANCH: main
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
